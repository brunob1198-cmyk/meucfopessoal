    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {"@type":"Question","name":"Como faço para lançar meu patrimônio?","acceptedAnswer":{"@type":"Answer","text":"Acesse o Balanço Patrimonial no menu lateral. Clique em 'Novo Ativo' para cadastrar bens (imóveis, investimentos, veículos) ou 'Novo Passivo' para dívidas (financiamentos, cartão de crédito). Informe nome, categoria, valor atual e data de aquisição. O patrimônio líquido é calculado automaticamente."}},
          {"@type":"Question","name":"Quais são os passos para fazer lançamentos?","acceptedAnswer":{"@type":"Answer","text":"Na tela de Lançamentos, localize a subcategoria desejada (ex: Combustível em AUTOMÓVEL). Clique no '+' à direita, preencha valor, data e comentário opcional, e clique em Salvar. Para compras parceladas, ative o switch 'Parcelado', informe o valor total e o número de parcelas."}},
          {"@type":"Question","name":"De que forma funciona o Consultor Financeiro IA?","acceptedAnswer":{"@type":"Answer","text":"Acesse Inteligência no menu, selecione o período desejado (recomendado: últimos 6-12 meses) e clique em 'Gerar Análise'. A IA analisa seus lançamentos e gera insights, alertas, sugestões e previsões personalizadas com números concretos dos seus dados. Na mesma tela, o Radar Econômico traduz Selic, CDI e inflação para o impacto no seu bolso."}},
          {"@type":"Question","name":"Qual a diferença entre o Consultor Financeiro IA e o Big B?","acceptedAnswer":{"@type":"Answer","text":"O Consultor Financeiro IA é um relatório sob demanda — você escolhe o período e clica em 'Gerar Análise'. O Big B é o assistente flutuante que fica disponível em qualquer tela do sistema, o tempo todo: ele avisa sozinho sobre orçamento estourado ou dinheiro parado sem render, e responde perguntas livres sobre suas finanças a qualquer momento, sem você precisar pedir um relatório."}},
          {"@type":"Question","name":"Como é possível criar metas financeiras?","acceptedAnswer":{"@type":"Answer","text":"Use o Mapa de Sonhos Financeiros para criar objetivos de vida (casa, viagem, aposentadoria). Defina nome, valor necessário, valor acumulado e data desejada. O sistema calcula automaticamente o valor mensal necessário e monitora seu progresso."}},
          {"@type":"Question","name":"Como acompanhar o score de saúde financeira?","acceptedAnswer":{"@type":"Answer","text":"O Score de Saúde Financeira calcula uma nota de 0 a 100 baseada em 5 pilares: liquidez, controle de gastos, endividamento, reserva de emergência e capacidade de poupança. Acesse pelo menu lateral e acompanhe a evolução mensal."}},
          {"@type":"Question","name":"Como compartilhar dados com um contador?","acceptedAnswer":{"@type":"Answer","text":"Em Meu Perfil, use a seção 'Compartilhamento de Acesso'. Informe o e-mail da pessoa, selecione a permissão (Visualização ou Edição) e envie o convite. A pessoa precisa ter conta no sistema."}},
          {"@type":"Question","name":"O que é o planejador e qual sua finalidade?","acceptedAnswer":{"@type":"Answer","text":"O Planejador é sua ferramenta de orçamento mensal. Defina quanto pretende gastar em cada categoria para meses futuros. Os valores aparecem em verde no DRE para comparar planejado vs realizado. Projete pelo menos 6 meses à frente."}}
